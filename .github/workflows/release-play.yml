name: Release to Google Play

# Builds a signed play-flavour App Bundle and uploads it to Google Play.
# Runs by hand from the Actions tab, when release-please tags a release, or
# on a version tag such as v0.2.0 (releases and tags use the PLAY_TAG_TRACK
# and PLAY_TAG_STATUS variables). Pull requests
# that change this workflow or the app's Gradle build check the signed build
# with a throwaway key; they skip the tests (CI runs them) and the upload.
#
# Secrets: PLAY_UPLOAD_KEYSTORE_BASE64, PLAY_UPLOAD_KEYSTORE_PASSWORD,
# PLAY_UPLOAD_KEY_ALIAS, PLAY_UPLOAD_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON.
# Variables (required): PLAY_PACKAGE_NAME, PLAY_VERSION_CODE_OFFSET, and for
# tags PLAY_TAG_TRACK and PLAY_TAG_STATUS.
# Variables (optional): PESACLARITY_API_URL, PESACLARITY_VAULT_URL,
# PESACLARITY_GOOGLE_SERVER_CLIENT_ID, PESACLARITY_PLAY_CLOUD_PROJECT,
# PESACLARITY_PINNED_HOSTS, PESACLARITY_TRUSTED_ROOTS, PESACLARITY_RATES_URL,
# PESACLARITY_RATES_SOURCE_NAME, PESACLARITY_RATES_SOURCE_URL.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
      status:
        description: Release status (use draft until the app's first release is reviewed)
        type: choice
        options: [completed, draft]
  push:
    tags: ["v*"]
  # Called by release-please.yml when it tags a release (a tag pushed with the
  # workflow token does not start workflows on its own).
  workflow_call:
    inputs:
      track:
        type: string
        required: false
      status:
        type: string
        required: false
  pull_request:
    paths:
      - .github/workflows/release-play.yml
      - android/app/build.gradle.kts

permissions:
  contents: read

concurrency:
  group: release-play
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.8"
  PACKAGE_NAME: ${{ vars.PLAY_PACKAGE_NAME }}
  VERSION_CODE_OFFSET: ${{ vars.PLAY_VERSION_CODE_OFFSET }}
  TRACK: ${{ inputs.track || vars.PLAY_TAG_TRACK }}
  STATUS: ${{ inputs.status || vars.PLAY_TAG_STATUS }}

jobs:
  release:
    name: Build and upload
    runs-on: ubuntu-latest
    environment: ${{ github.event_name != 'pull_request' && 'play-store' || '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for name in KEYSTORE SERVICE_ACCOUNT PACKAGE_NAME VERSION_CODE_OFFSET TRACK STATUS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Play release secrets or variables for:$missing (see README, Releasing)."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Test
        if: github.event_name != 'pull_request'
        run: flutter test

      # key.properties and the keystore stay on the runner; both are gitignored.
      - name: Set up signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Set up a throwaway signing key
        if: github.event_name == 'pull_request'
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass throwaway -keypass throwaway -alias upload \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI check"
          printf 'storeFile=%s\nstorePassword=throwaway\nkeyAlias=upload\nkeyPassword=throwaway\n' \
            "$RUNNER_TEMP/upload.jks" > android/key.properties

      # Play needs a higher version code on every upload. The run number keeps
      # rising; the offset leaves room for builds uploaded by hand.
      - name: Build App Bundle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          API_URL: ${{ vars.PESACLARITY_API_URL }}
          VAULT_URL: ${{ vars.PESACLARITY_VAULT_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.PESACLARITY_GOOGLE_SERVER_CLIENT_ID }}
          CLOUD_PROJECT: ${{ vars.PESACLARITY_PLAY_CLOUD_PROJECT }}
          PINNED_HOSTS: ${{ vars.PESACLARITY_PINNED_HOSTS }}
          TRUSTED_ROOTS: ${{ vars.PESACLARITY_TRUSTED_ROOTS }}
          RATES_URL: ${{ vars.PESACLARITY_RATES_URL }}
          RATES_SOURCE_NAME: ${{ vars.PESACLARITY_RATES_SOURCE_NAME }}
          RATES_SOURCE_URL: ${{ vars.PESACLARITY_RATES_SOURCE_URL }}
        run: |
          # Pull requests only check the build, so they need no offset.
          offset="$VERSION_CODE_OFFSET"
          [ "$GITHUB_EVENT_NAME" = pull_request ] && offset=0
          build_number=$((BUILD_NUMBER + offset))
          flutter build appbundle --release --flavor play \
            --build-number="$build_number" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=PESACLARITY_API_URL="$API_URL" \
            --dart-define=PESACLARITY_VAULT_URL="$VAULT_URL" \
            --dart-define=PESACLARITY_GOOGLE_SERVER_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --dart-define=PESACLARITY_PLAY_CLOUD_PROJECT="$CLOUD_PROJECT" \
            --dart-define=PESACLARITY_PINNED_HOSTS="$PINNED_HOSTS" \
            --dart-define=PESACLARITY_TRUSTED_ROOTS="$TRUSTED_ROOTS" \
            --dart-define=PESACLARITY_RATES_URL="$RATES_URL" \
            --dart-define=PESACLARITY_RATES_SOURCE_NAME="$RATES_SOURCE_NAME" \
            --dart-define=PESACLARITY_RATES_SOURCE_URL="$RATES_SOURCE_URL"

      - name: Check the bundle is signed with the upload key
        run: |
          jarsigner -verify build/app/outputs/bundle/playRelease/app-play-release.aab | tail -1
          keytool -printcert -jarfile build/app/outputs/bundle/playRelease/app-play-release.aab \
            | grep -q "Android Debug" && { echo "::error::Signed with the debug key"; exit 1; } || true

      - name: Upload to Google Play
        if: github.event_name != 'pull_request'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/playRelease/app-play-release.aab
          track: ${{ env.TRACK }}
          status: ${{ env.STATUS }}
          mappingFile: build/app/outputs/mapping/playRelease/mapping.txt

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: pesaclarity-play-release
          path: |
            build/app/outputs/bundle/playRelease/app-play-release.aab
            build/app/outputs/mapping/playRelease/mapping.txt
            build/symbols
          retention-days: 30

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"
