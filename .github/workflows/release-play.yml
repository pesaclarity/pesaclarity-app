name: Release to Google Play

# Builds a signed play-flavour App Bundle and uploads it to Google Play,
# with the release's plain notes as Play's "What's new" (tool/release_notes).
# Runs by hand from the Actions tab, when release-please tags a release, or
# on a version tag such as v0.2.0 (releases and tags use the PLAY_TAG_TRACK
# and PLAY_TAG_STATUS variables). Tests run before each push
# (tool/check, from the pre-push hook), not here.
#
# Uploads from a release or a tag are paused until the PLAY_UPLOADS_ENABLED
# repository variable is "true" (set it once Google approves the app); until
# then those runs skip the upload job and say so in the run summary. Runs by
# hand always build and upload.
#
# Runs in the "production" environment; its secrets and variables are used.
# Secrets: PLAY_UPLOAD_KEYSTORE_BASE64, PLAY_UPLOAD_KEYSTORE_PASSWORD,
# PLAY_UPLOAD_KEY_ALIAS, PLAY_UPLOAD_KEY_PASSWORD, PLAY_SERVICE_ACCOUNT_JSON.
# Variables (required): PLAY_PACKAGE_NAME, PLAY_VERSION_CODE_OFFSET, and for
# tags PLAY_TAG_TRACK and PLAY_TAG_STATUS.
# Secrets or variables (optional; a secret wins): PESACLARITY_API_URL,
# PESACLARITY_VAULT_URL (defaults to the API address).
# Variables (optional):
# PESACLARITY_GOOGLE_SERVER_CLIENT_ID, PESACLARITY_PLAY_CLOUD_PROJECT,
# PESACLARITY_PINNED_HOSTS, PESACLARITY_TRUSTED_ROOTS, PESACLARITY_RATES_URL,
# PESACLARITY_RATES_SOURCE_NAME, PESACLARITY_RATES_SOURCE_URL.
on:
  workflow_dispatch:
    inputs:
      track:
        description: Play track
        type: choice
        options: [internal, alpha, beta, production]
      status:
        description: Release status (use draft until the app's first release is reviewed)
        type: choice
        options: [completed, draft]
  push:
    tags: ["v*"]
  # Called by release-please.yml when it tags a release (a tag pushed with the
  # workflow token does not start workflows on its own).
  workflow_call:
    inputs:
      track:
        type: string
        required: false
      status:
        type: string
        required: false

permissions:
  contents: read
  # tool/release_notes reads the merged pull requests' notes.
  pull-requests: read

concurrency:
  group: release-play
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  # A job-level `if` sees repository and organisation variables only, not
  # the production environment's, so the switch is a repository variable.
  uploads:
    name: Play uploads on?
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          ENABLED: ${{ vars.PLAY_UPLOADS_ENABLED }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ "$GITHUB_EVENT_NAME" = pull_request ] ||
            [ "$ENABLED" = true ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Google Play uploads are paused; set the PLAY_UPLOADS_ENABLED variable to true to turn them on (README, Releasing to Google Play)."
            echo "Google Play uploads are paused until the \`PLAY_UPLOADS_ENABLED\` variable is \`true\`; run this workflow by hand to upload." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Build and upload
    needs: uploads
    if: needs.uploads.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name != 'pull_request' && 'production' || '' }}
    # Job-level, so the production environment's variables are seen.
    env:
      PACKAGE_NAME: ${{ vars.PLAY_PACKAGE_NAME }}
      VERSION_CODE_OFFSET: ${{ vars.PLAY_VERSION_CODE_OFFSET }}
      TRACK: ${{ inputs.track || vars.PLAY_TAG_TRACK }}
      STATUS: ${{ inputs.status || vars.PLAY_TAG_STATUS }}
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          SERVICE_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for name in KEYSTORE SERVICE_ACCOUNT PACKAGE_NAME VERSION_CODE_OFFSET TRACK STATUS; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing Play release secrets or variables for:$missing (see README, Releasing)."
            exit 1
          fi

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Play's "What's new", built here on every run (by hand too) for the
      # version in pubspec.yaml, from the pull requests merged since the
      # previous release tag. Kept in the artifact below, to paste into Play
      # Console when uploading by hand.
      - name: Write the release notes
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          tool/release_notes --version "$version" --to "$GITHUB_SHA" \
            --whatsnew-dir distribution/whatsnew
          {
            echo "### What's new on Google Play"
            echo
            echo '```'
            cat distribution/whatsnew/whatsnew-en-US
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # key.properties and the keystore stay on the runner; both are gitignored.
      - name: Set up signing
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Set up a throwaway signing key
        if: github.event_name == 'pull_request'
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass throwaway -keypass throwaway -alias upload \
            -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI check"
          printf 'storeFile=%s\nstorePassword=throwaway\nkeyAlias=upload\nkeyPassword=throwaway\n' \
            "$RUNNER_TEMP/upload.jks" > android/key.properties

      # Play needs a higher version code on every upload. The run number keeps
      # rising; the offset leaves room for builds uploaded by hand.
      - name: Build App Bundle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          API_URL: ${{ secrets.PESACLARITY_API_URL || vars.PESACLARITY_API_URL }}
          VAULT_URL: ${{ secrets.PESACLARITY_VAULT_URL || vars.PESACLARITY_VAULT_URL || secrets.PESACLARITY_API_URL || vars.PESACLARITY_API_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.PESACLARITY_GOOGLE_SERVER_CLIENT_ID }}
          CLOUD_PROJECT: ${{ vars.PESACLARITY_PLAY_CLOUD_PROJECT }}
          PINNED_HOSTS: ${{ vars.PESACLARITY_PINNED_HOSTS }}
          TRUSTED_ROOTS: ${{ vars.PESACLARITY_TRUSTED_ROOTS }}
          RATES_URL: ${{ vars.PESACLARITY_RATES_URL }}
          RATES_SOURCE_NAME: ${{ vars.PESACLARITY_RATES_SOURCE_NAME }}
          RATES_SOURCE_URL: ${{ vars.PESACLARITY_RATES_SOURCE_URL }}
        run: |
          # Pull requests only check the build, so they need no offset.
          offset="$VERSION_CODE_OFFSET"
          [ "$GITHUB_EVENT_NAME" = pull_request ] && offset=0
          build_number=$((BUILD_NUMBER + offset))
          # Repository variables replace tool/rates.env's service.
          . tool/rates.env
          RATES_URL="${RATES_URL:-$PESACLARITY_RATES_URL}"
          RATES_SOURCE_NAME="${RATES_SOURCE_NAME:-$PESACLARITY_RATES_SOURCE_NAME}"
          RATES_SOURCE_URL="${RATES_SOURCE_URL:-$PESACLARITY_RATES_SOURCE_URL}"
          flutter build appbundle --release --flavor play \
            --build-number="$build_number" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=PESACLARITY_API_URL="$API_URL" \
            --dart-define=PESACLARITY_VAULT_URL="$VAULT_URL" \
            --dart-define=PESACLARITY_GOOGLE_SERVER_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --dart-define=PESACLARITY_PLAY_CLOUD_PROJECT="$CLOUD_PROJECT" \
            --dart-define=PESACLARITY_PINNED_HOSTS="$PINNED_HOSTS" \
            --dart-define=PESACLARITY_TRUSTED_ROOTS="$TRUSTED_ROOTS" \
            --dart-define=PESACLARITY_RATES_URL="$RATES_URL" \
            --dart-define=PESACLARITY_RATES_SOURCE_NAME="$RATES_SOURCE_NAME" \
            --dart-define=PESACLARITY_RATES_SOURCE_URL="$RATES_SOURCE_URL"

      - name: Check the bundle is signed with the upload key
        run: |
          jarsigner -verify build/app/outputs/bundle/playRelease/app-play-release.aab | tail -1
          keytool -printcert -jarfile build/app/outputs/bundle/playRelease/app-play-release.aab \
            | grep -q "Android Debug" && { echo "::error::Signed with the debug key"; exit 1; } || true

      # Kept before the upload, so the bundle is there to upload by hand when
      # Play refuses the API (the app's first release must be uploaded in
      # Play Console).
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: pesaclarity-play-release
          path: |
            build/app/outputs/bundle/playRelease/app-play-release.aab
            build/app/outputs/mapping/playRelease/mapping.txt
            build/symbols
            distribution/whatsnew
          retention-days: 30

      - name: Upload to Google Play
        if: github.event_name != 'pull_request'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: build/app/outputs/bundle/playRelease/app-play-release.aab
          track: ${{ env.TRACK }}
          status: ${{ env.STATUS }}
          mappingFile: build/app/outputs/mapping/playRelease/mapping.txt
          whatsNewDirectory: distribution/whatsnew

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload.jks"
