name: APK

# Builds the play flavour and the foss (F-Droid) flavour as release APKs,
# signed with the dev key (or a throwaway key without it), for ARM phones.
# Each run keeps them as artifacts for 30 days, and puts them on Releases:
#
# - dev, every push: the test-build pre-release, for QA to try before dev is
#   merged to main. Its notes list the changes since the last release.
#   https://github.com/pesaclarity/pesaclarity-app/releases/download/test-build/pesaclarity-play.apk
# - main, when the push is a release (merging release-please's pull request):
#   that version's release, whose notes are the changelog.
#   https://github.com/pesaclarity/pesaclarity-app/releases/latest/download/pesaclarity-play.apk
#
# CI (ci.yml) runs the tests on the same push, so they are not repeated here.
on:
  push:
    branches: [dev, main]
    paths-ignore:
      - "*.md"
      - docs/**
      - .github/ISSUE_TEMPLATE/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  # A newer push replaces an unfinished dev build; main builds always finish,
  # so every release gets its APKs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  build:
    name: Build ${{ matrix.flavor }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        flavor: [play, foss]
    steps:
      # Two commits, to tell whether this push is a release. No stored token:
      # build code runs in this job, and only the publish steps get one.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      # A release (the push that merges release-please's pull request, which
      # changes the manifest) is named after the version, such as 0.2.0.
      # Other builds add the branch and run number, such as 0.2.0-dev.31.
      # The run number is the version code, so it keeps rising across dev and
      # main and each APK installs over the one before.
      - name: Name the build
        id: version
        run: |
          version=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
          if [ "$GITHUB_REF" = refs/heads/main ] &&
            ! git diff --quiet HEAD^ HEAD -- .release-please-manifest.json; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            name="$version"
          else
            name="$version-${GITHUB_REF_NAME//[^A-Za-z0-9]/-}.$GITHUB_RUN_NUMBER"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Building $name"

      # The same changes F-Droid makes: no prebuilt native libraries.
      - name: Prepare the F-Droid build
        if: matrix.flavor == 'foss'
        run: ./tool/prepare_foss.sh

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # Gradle reuses the outputs of unchanged tasks (Kotlin, dex, R8) from
      # the last run. The key is new each run, so the cache stays current.
      - name: Turn on the Gradle build cache
        run: |
          mkdir -p "$HOME/.gradle"
          echo "org.gradle.caching=true" >> "$HOME/.gradle/gradle.properties"
      - uses: actions/cache@v6
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-${{ matrix.flavor }}-${{ github.run_id }}
          restore-keys: gradle-build-${{ matrix.flavor }}-

      - run: flutter pub get

      # build_runner reuses its compiled build script while the packages
      # stay the same.
      - uses: actions/cache@v6
        with:
          path: .dart_tool/build/entrypoint
          key: build-runner-${{ matrix.flavor }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
      - run: dart run build_runner build --delete-conflicting-outputs

      # Google sign-in only works for an app signed with a key registered in
      # Google Cloud, so builds use the dev key when it is set. Without it
      # they get a throwaway key and the Google button stays hidden.
      - name: Set up the signing key
        env:
          DEV_KEYSTORE: ${{ secrets.DEV_KEYSTORE_BASE64 }}
          DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          DEV_KEY_ALIAS: ${{ secrets.DEV_KEY_ALIAS }}
          DEV_KEY_PASSWORD: ${{ secrets.DEV_KEY_PASSWORD }}
        run: |
          if [ -n "$DEV_KEYSTORE" ]; then
            echo "$DEV_KEYSTORE" | base64 -d > "$RUNNER_TEMP/test.jks"
            printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$RUNNER_TEMP/test.jks" "$DEV_KEYSTORE_PASSWORD" "$DEV_KEY_ALIAS" \
              "$DEV_KEY_PASSWORD" > android/key.properties
            echo "DEV_SIGNED=true" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/test.jks" \
              -storepass throwaway -keypass throwaway -alias test \
              -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Test build"
            printf 'storeFile=%s\nstorePassword=throwaway\nkeyAlias=test\nkeyPassword=throwaway\n' \
              "$RUNNER_TEMP/test.jks" > android/key.properties
          fi

      # Server settings follow the branch: main builds use the release
      # variables, other branches the dev ones; empty ones leave that feature
      # off. The Google client id follows the signing key, so it is the dev
      # one. 32- and 64-bit ARM only: x86_64 is for emulators.
      - name: Build the APK
        id: build
        env:
          BUILD_NAME: ${{ steps.version.outputs.name }}
          BUILD_NUMBER: ${{ github.run_number }}
          FLAVOR: ${{ matrix.flavor }}
          API_URL: ${{ github.ref == 'refs/heads/main' && (secrets.PESACLARITY_API_URL || vars.PESACLARITY_API_URL) || secrets.DEV_PESACLARITY_API_URL || vars.DEV_PESACLARITY_API_URL }}
          VAULT_URL: ${{ github.ref == 'refs/heads/main' && (secrets.PESACLARITY_VAULT_URL || vars.PESACLARITY_VAULT_URL) || secrets.DEV_PESACLARITY_VAULT_URL || vars.DEV_PESACLARITY_VAULT_URL }}
          PINNED_HOSTS: ${{ github.ref == 'refs/heads/main' && vars.PESACLARITY_PINNED_HOSTS || vars.DEV_PESACLARITY_PINNED_HOSTS }}
          TRUSTED_ROOTS: ${{ github.ref == 'refs/heads/main' && vars.PESACLARITY_TRUSTED_ROOTS || vars.DEV_PESACLARITY_TRUSTED_ROOTS }}
          RATES_URL: ${{ vars.PESACLARITY_RATES_URL }}
          RATES_SOURCE_NAME: ${{ vars.PESACLARITY_RATES_SOURCE_NAME }}
          RATES_SOURCE_URL: ${{ vars.PESACLARITY_RATES_SOURCE_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.DEV_PESACLARITY_GOOGLE_SERVER_CLIENT_ID }}
        run: |
          # The client id only helps when the app is signed with the dev key.
          [ "$DEV_SIGNED" = true ] || GOOGLE_CLIENT_ID=""
          VAULT_URL="${VAULT_URL:-$API_URL}"
          flutter build apk --release --flavor "$FLAVOR" \
            --target-platform android-arm,android-arm64 \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER" \
            --dart-define=PESACLARITY_VERSION="$BUILD_NAME" \
            --dart-define=PESACLARITY_API_URL="$API_URL" \
            --dart-define=PESACLARITY_VAULT_URL="$VAULT_URL" \
            --dart-define=PESACLARITY_PINNED_HOSTS="$PINNED_HOSTS" \
            --dart-define=PESACLARITY_TRUSTED_ROOTS="$TRUSTED_ROOTS" \
            --dart-define=PESACLARITY_RATES_URL="$RATES_URL" \
            --dart-define=PESACLARITY_RATES_SOURCE_NAME="$RATES_SOURCE_NAME" \
            --dart-define=PESACLARITY_RATES_SOURCE_URL="$RATES_SOURCE_URL" \
            --dart-define=PESACLARITY_GOOGLE_SERVER_CLIENT_ID="$GOOGLE_CLIENT_ID"
          name="pesaclarity-$BUILD_NAME-${GITHUB_SHA::7}-$FLAVOR.apk"
          cp "build/app/outputs/flutter-apk/app-$FLAVOR-release.apk" "$RUNNER_TEMP/$name"
          echo "path=$RUNNER_TEMP/$name" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/test.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.name }}
          path: ${{ steps.build.outputs.path }}
          retention-days: 30

      # Only dev-key builds go on Releases: Android will not install an update
      # signed with a different key, and uninstalling first deletes the
      # person's data. Throwaway-signed builds stay in the artifacts.
      - name: Skip Releases without the dev key
        if: env.DEV_SIGNED != 'true' && (github.ref == 'refs/heads/dev' || steps.version.outputs.release == 'true')
        run: echo "::warning::Not put on Releases; add the DEV_KEYSTORE_* secrets (README, Google sign-in)."

      - name: Put on the test-build release
        if: env.DEV_SIGNED == 'true' && github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APK: ${{ steps.build.outputs.path }}
          FLAVOR: ${{ matrix.flavor }}
          BUILD_NAME: ${{ steps.version.outputs.name }}
        run: tool/publish_apk.sh test-build "$APK" "$FLAVOR" "$BUILD_NAME"

      - name: Add to the release
        if: env.DEV_SIGNED == 'true' && steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          APK: ${{ steps.build.outputs.path }}
          FLAVOR: ${{ matrix.flavor }}
          VERSION: ${{ steps.version.outputs.version }}
        run: tool/publish_apk.sh release "$APK" "$FLAVOR" "$VERSION"

  # Rebuilds pesaclarity.github.io once both APKs are on Releases, so the
  # version under its download buttons is the one people get. Needs the
  # WEB_DISPATCH_TOKEN secret: a fine-grained token for pesaclarity-web with
  # Contents read and write (README, Website).
  website:
    name: Refresh the website
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ask the website to rebuild
        env:
          GH_TOKEN: ${{ secrets.WEB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::Website not refreshed; add the WEB_DISPATCH_TOKEN secret (README, Website)."
            exit 0
          fi
          gh api repos/pesaclarity/pesaclarity-web/dispatches \
            -f event_type=app-build \
            -f "client_payload[ref]=$GITHUB_REF_NAME" \
            -f "client_payload[sha]=$GITHUB_SHA"
