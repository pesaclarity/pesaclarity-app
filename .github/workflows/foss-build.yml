name: Foss build

# A release build of the foss flavour, checked for SQLCipher built from source, PDFium
# and Google sign-in code.
# Pull requests run it only when the Android build or dependencies change;
# main runs it after every app change, to catch release-only build failures.
on:
  push:
    branches: [main]
    paths:
      - lib/**
      - assets/**
      - android/**
      - pubspec.yaml
      - pubspec.lock
      - tool/prepare_foss.sh
      - tool/foss/**
      - .github/workflows/foss-build.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - android/**
      - pubspec.yaml
      - pubspec.lock
      - tool/prepare_foss.sh
      - tool/foss/**
      - .github/workflows/foss-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foss-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  build-foss:
    name: Build foss APK
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The same changes F-Droid makes: no prebuilt native libraries.
      - name: Prepare the F-Droid build
        run: ./tool/prepare_foss.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # CI has no release keystore, so this APK is signed with the debug key.
      - name: Build APK
        run: >-
          flutter build apk --release --flavor foss
          --obfuscate --split-debug-info=build/symbols

      # tool/foss/sqlcipher.sh: compiled by package:sqlite3's hook as libsqlite3.so, with
      # LibTomCrypt. The hook's download is libsqlcipher.so and links OpenSSL.
      - name: Check SQLCipher was built from source
        run: |
          apk=build/app/outputs/flutter-apk/app-foss-release.apk
          status=0
          if unzip -l "$apk" | grep -q 'libsqlcipher\.so'; then
            echo "::error::The foss APK contains the prebuilt SQLCipher"
            status=1
          fi
          for abi in arm64-v8a armeabi-v7a x86_64; do
            lib="$RUNNER_TEMP/libsqlite3-$abi.so"
            unzip -p "$apk" "lib/$abi/libsqlite3.so" > "$lib"
            if ! strings "$lib" | grep -qx libtomcrypt || strings "$lib" | grep -q '^OpenSSL [0-9]'; then
              echo "::error::lib/$abi/libsqlite3.so is not SQLCipher with LibTomCrypt"
              status=1
            fi
          done
          exit $status

      # The same source build, for this machine: databases from either build open in it.
      - name: Test SQLCipher built from source
        run: >-
          flutter test test/data/sqlcipher_format_test.dart test/data/app_database_test.dart
          test/features/backup/local_database_backup_test.dart
          --dart-define=EXPECT_CIPHER_PROVIDER=libtomcrypt

      - name: Check the foss APK has no PDFium
        run: |
          if unzip -l build/app/outputs/flutter-apk/app-foss-release.apk | grep -q libpdfium; then
            echo "::error::The foss APK contains PDFium"
            exit 1
          fi

      # Google sign-in lives in the play flavour only; F-Droid rejects Google libraries.
      - name: Check the foss APK has no Google sign-in code
        run: |
          apk=build/app/outputs/flutter-apk/app-foss-release.apk
          if unzip -p "$apk" 'classes*.dex' | grep -a -q -E \
            'Lcom/google/android/libraries/identity/googleid/|Landroidx/credentials/playservices/'; then
            echo "::error::The foss APK contains Google sign-in classes"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: pesaclarity-foss-apk
          path: build/app/outputs/flutter-apk/app-foss-release.apk
          retention-days: 14
