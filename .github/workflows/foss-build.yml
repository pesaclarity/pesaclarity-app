name: Foss build

# A release build of the foss flavour, checked for Google sign-in code.
# main runs it after every app change, to catch release-only build failures;
# run it by hand to check a branch first. Pull requests don't run it.
on:
  push:
    branches: [main]
    paths:
      - lib/**
      - assets/**
      - android/**
      - pubspec.yaml
      - pubspec.lock
      - tool/prepare_foss.sh
      - tool/foss/**
      - tool/support.env
      - .github/workflows/foss-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foss-build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  build-foss:
    name: Build foss APK
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      # The same changes F-Droid makes: no prebuilt native libraries.
      - name: Prepare the F-Droid build
        run: ./tool/prepare_foss.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # CI has no release keystore, so this APK is signed with the debug key.
      # Giving comes from tool/support.env unless repository variables say
      # otherwise.
      - name: Build APK
        env:
          SUPPORT_URL: ${{ vars.PESACLARITY_SUPPORT_URL }}
          SUPPORT_PAYEES: ${{ vars.PESACLARITY_SUPPORT_PAYEES }}
          SUPPORT_COSTS_URL: ${{ vars.PESACLARITY_SUPPORT_COSTS_URL }}
        run: |
          . tool/support.env
          flutter build apk --release --flavor foss \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=PESACLARITY_SUPPORT_URL="${SUPPORT_URL:-$PESACLARITY_SUPPORT_URL}" \
            --dart-define=PESACLARITY_SUPPORT_PAYEES="${SUPPORT_PAYEES:-$PESACLARITY_SUPPORT_PAYEES}" \
            --dart-define=PESACLARITY_SUPPORT_COSTS_URL="${SUPPORT_COSTS_URL:-$PESACLARITY_SUPPORT_COSTS_URL}"

      - name: Check the foss APK has no PDFium
        run: |
          if unzip -l build/app/outputs/flutter-apk/app-foss-release.apk | grep -q libpdfium; then
            echo "::error::The foss APK contains PDFium"
            exit 1
          fi

      # tool/prepare_foss.sh has the hook compile SQLCipher (libsqlite3.so)
      # instead of downloading the prebuilt libsqlcipher.so.
      - name: Check the foss APK has SQLCipher built from source
        run: |
          apk=build/app/outputs/flutter-apk/app-foss-release.apk
          if unzip -l "$apk" | grep -q libsqlcipher; then
            echo "::error::The foss APK contains the prebuilt SQLCipher"
            exit 1
          fi
          unzip -p "$apk" lib/arm64-v8a/libsqlite3.so > "$RUNNER_TEMP/libsqlite3.so"
          if ! grep -a -q 'libtomcrypt' "$RUNNER_TEMP/libsqlite3.so"; then
            echo "::error::The foss APK's SQLite is not SQLCipher with LibTomCrypt"
            exit 1
          fi

      # rayo runs the Ask models, compiled from source by its build hook;
      # no prebuilt ML library (TFLite/LiteRT) may come back.
      - name: Check the foss APK has rayo and no TFLite
        run: |
          apk=build/app/outputs/flutter-apk/app-foss-release.apk
          {
            echo "### Native libraries in the foss APK"
            echo '```'
            unzip -l "$apk" 'lib/*'
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if unzip -l "$apk" | grep -q -i -E 'libtensorflowlite|liblitert'; then
            echo "::error::The foss APK contains a TFLite/LiteRT library"
            exit 1
          fi
          if ! unzip -l "$apk" | grep -q 'lib/arm64-v8a/librayo.so'; then
            echo "::error::The foss APK has no librayo.so"
            exit 1
          fi

      # Google sign-in lives in the play flavour only; F-Droid rejects Google libraries.
      - name: Check the foss APK has no Google sign-in code
        run: |
          apk=build/app/outputs/flutter-apk/app-foss-release.apk
          if unzip -p "$apk" 'classes*.dex' | grep -a -q -E \
            'Lcom/google/android/libraries/identity/googleid/|Landroidx/credentials/playservices/'; then
            echo "::error::The foss APK contains Google sign-in classes"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: pesaclarity-foss-apk
          path: build/app/outputs/flutter-apk/app-foss-release.apk
          retention-days: 14
