name: CI

# Skips changes that cannot affect the app (docs, UI flow scripts, other
# workflows) and draft pull requests; marking a draft ready runs it.
on:
  push:
    branches: [main, dev]
    paths-ignore: &skip
      - "*.md"
      - docs/**
      - LICENSE
      - fastlane/**
      - .maestro/**
      - tool/run_ui_flows.sh
      - tool/ui_diagnostics.sh
      - tool/install_app.sh
      - .github/ISSUE_TEMPLATE/**
      - .github/workflows/ui-screenshots.yml
      - .github/workflows/dependency-scan.yml
      - .github/workflows/release-play.yml
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: *skip
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  check:
    name: Format, analyse, test
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test
