name: UI screenshots

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".maestro/**"
      - ".github/workflows/ui-screenshots.yml"
      - "tool/run_ui_flows.sh"
      - "tool/ui_diagnostics.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-screenshots-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.8"
  MAESTRO_VERSION: "2.11.0"
  API_LEVEL: "34"
  AVD_ARCH: x86_64
  AVD_TARGET: google_apis
  AVD_PROFILE: pixel_6
  AVD_CORES: "4"
  AVD_RAM: 4096M
  MAESTRO_CLI_NO_ANALYTICS: "1"
  MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: "true"
  MAESTRO_DRIVER_STARTUP_TIMEOUT: "120000"

jobs:
  flows:
    name: Run UI flows and capture screens
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The emulator system image does not fit on a stock runner. Keep the
      # Android SDK and toolcaches the job uses; drop what it never touches.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift
          docker image prune -af
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build debug APK
        run: |
          flutter build apk --debug --flavor foss --target-platform android-x64
          cp build/app/outputs/flutter-apk/app-foss-debug.apk "$RUNNER_TEMP/app.apk"
          rm -rf build/app/intermediates build/app/tmp
          df -h /

      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" \
            "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Cache AVD
        id: avd-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-${{ env.AVD_ARCH }}-${{ env.AVD_TARGET }}-${{ env.AVD_PROFILE }}-${{ env.AVD_CORES }}-${{ env.AVD_RAM }}

      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: ${{ env.AVD_ARCH }}
          target: ${{ env.AVD_TARGET }}
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          ram-size: ${{ env.AVD_RAM }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created."

      - name: Run Maestro flows
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          arch: ${{ env.AVD_ARCH }}
          target: ${{ env.AVD_TARGET }}
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          ram-size: ${{ env.AVD_RAM }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb install -r "$RUNNER_TEMP/app.apk"
            ./tool/ui_diagnostics.sh build/maestro/diagnostics/startup
            ./tool/run_ui_flows.sh build/maestro

      # upload-artifact rejects these characters; Maestro names folders after
      # flows. run_ui_flows.sh does this too, but may not reach the end.
      - name: Sanitise output paths
        if: always()
        run: |
          [ -d build/maestro ] || exit 0
          # shellcheck disable=SC1003
          find build/maestro -depth -name '*[<>:"|?*\\]*' | while IFS= read -r path; do
            mv "$path" "$(dirname "$path")/$(basename "$path" | tr '<>:"|?*\\' '________')"
          done

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## UI screenshots"
            echo
            found=0
            for theme in light dark; do
              dir="build/maestro/$theme"
              [ -d "$dir" ] || continue
              echo "### ${theme^}"
              echo
              while IFS= read -r shot; do
                echo "- \`$(basename "$shot")\`"
                found=1
              done < <(find "$dir" -name '*.png' | sort)
              echo
            done
            if [ -d build/maestro/diagnostics ]; then
              echo "Device diagnostics (logcat, screen, hierarchy) are in \`diagnostics/\` in the artifact."
              echo
            fi
            if [ "$found" = 0 ]; then
              echo "No screenshots were captured. See the job log and the Maestro reports."
            else
              echo "Download the \`ui-screenshots\` artifact to view them."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload screenshots and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: build/maestro/
          if-no-files-found: warn
          retention-days: 14
