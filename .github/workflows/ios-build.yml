name: iOS build

# Builds the iPhone app without signing. The unsigned .ipa is for testers who
# sideload with their own Apple ID (SideStore or AltStore re-sign it, and it
# lasts 7 days per signing). Run by hand. TestFlight needs an Apple developer
# account first. evening-builds.yml starts it on dev each evening; it only
# builds when dev has moved since the last iPhone build, unless forced.
# It is a test build, so it is rayo-only (RAYO_ONLY=true): a model rayo
# cannot run says why in Ask and Profile › About instead of running in Dart.
# It also carries the on-phone language model experiment (SLM_EXPERIMENT):
# slm-model.yml's .weights goes into Runner.app/slm/, in this build only.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Put the unsigned .ipa on the test-build release
        type: boolean
        default: true
      force:
        description: Build even if this commit is already the iPhone test build
        type: boolean
        default: false
      simulator:
        description: Also build for the simulator
        type: boolean
        default: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.50.1"

jobs:
  # A cheap Linux check first, so an unchanged evening costs no macOS time.
  changes:
    name: Anything new to build?
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          built="$(gh release download test-build -p pesaclarity-ios-commit.txt -O - 2>/dev/null || true)"
          if [ "$built" = "$GITHUB_SHA" ]; then
            echo "The iPhone test build is already ${GITHUB_SHA::7}; nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # The experiment's model, made once and kept on the slm-models release.
  slm-model:
    name: Language model (experiment)
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/slm-model.yml

  build:
    name: Build for iPhone (unsigned)
    needs: [changes, slm-model]
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Server settings come from the dev environment's variables; empty
      # ones leave that feature off.
      - name: Build the app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          API_URL: ${{ secrets.PESACLARITY_API_URL || vars.PESACLARITY_API_URL }}
          VAULT_URL: ${{ secrets.PESACLARITY_VAULT_URL || vars.PESACLARITY_VAULT_URL || secrets.PESACLARITY_API_URL || vars.PESACLARITY_API_URL }}
          PINNED_HOSTS: ${{ vars.PESACLARITY_PINNED_HOSTS }}
          TRUSTED_ROOTS: ${{ vars.PESACLARITY_TRUSTED_ROOTS }}
          RATES_URL: ${{ vars.PESACLARITY_RATES_URL }}
          RATES_SOURCE_NAME: ${{ vars.PESACLARITY_RATES_SOURCE_NAME }}
          RATES_SOURCE_URL: ${{ vars.PESACLARITY_RATES_SOURCE_URL }}
        run: |
          # Repository variables replace tool/rates.env's service.
          . tool/rates.env
          RATES_URL="${RATES_URL:-$PESACLARITY_RATES_URL}"
          RATES_SOURCE_NAME="${RATES_SOURCE_NAME:-$PESACLARITY_RATES_SOURCE_NAME}"
          RATES_SOURCE_URL="${RATES_SOURCE_URL:-$PESACLARITY_RATES_SOURCE_URL}"
          flutter build ios --release --no-codesign \
            --build-number="$BUILD_NUMBER" \
            --dart-define=PESACLARITY_API_URL="$API_URL" \
            --dart-define=PESACLARITY_VAULT_URL="$VAULT_URL" \
            --dart-define=PESACLARITY_PINNED_HOSTS="$PINNED_HOSTS" \
            --dart-define=PESACLARITY_TRUSTED_ROOTS="$TRUSTED_ROOTS" \
            --dart-define=PESACLARITY_RATES_URL="$RATES_URL" \
            --dart-define=PESACLARITY_RATES_SOURCE_NAME="$RATES_SOURCE_NAME" \
            --dart-define=PESACLARITY_RATES_SOURCE_URL="$RATES_SOURCE_URL" \
            --dart-define=RAYO_ONLY=true \
            --dart-define=SLM_EXPERIMENT=true

      # The experiment's model goes into the app as a plain file (not a
      # Flutter asset, so no other build can pick it up), checked first.
      - name: Add the language model (experiment)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA256: ${{ needs.slm-model.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/slm"
          gh release download slm-models -p smollm2-360m-instruct-q4.weights -D "$RUNNER_TEMP/slm" --clobber
          echo "$SHA256  $RUNNER_TEMP/slm/smollm2-360m-instruct-q4.weights" | shasum -a 256 -c -
          for app in build/ios/iphoneos/Runner.app; do
            mkdir -p "$app/slm"
            cp "$RUNNER_TEMP/slm/smollm2-360m-instruct-q4.weights" "$app/slm/"
          done

      # An .ipa is the .app inside a Payload folder, zipped. Unsigned: the
      # sideloading tool signs it with the tester's Apple ID, which leaves out
      # App Attest, so sign-in stays off on these builds.
      - name: Package the unsigned .ipa
        run: |
          out="$RUNNER_TEMP/ipa"
          mkdir -p "$out/Payload"
          cp -R build/ios/iphoneos/Runner.app "$out/Payload/"
          (cd "$out" && zip -qr pesaclarity-ios-unsigned.ipa Payload)
          echo "IPA=$out/pesaclarity-ios-unsigned.ipa" >> "$GITHUB_ENV"
          echo "IPA size: $(stat -f%z "$out/pesaclarity-ios-unsigned.ipa") bytes" | tee -a "$GITHUB_STEP_SUMMARY"

      # A SideStore/AltStore source: a small list naming the newest build, so
      # testers who add it see Update in SideStore when a new one is out.
      - name: Write the SideStore source
        run: |
          plist=build/ios/iphoneos/Runner.app/Info.plist
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$plist")" \
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$plist")" \
          MIN_OS="$(/usr/libexec/PlistBuddy -c 'Print MinimumOSVersion' "$plist")" \
          SIZE="$(stat -f%z "$IPA")" \
          IPA_URL="https://github.com/${{ github.repository }}/releases/download/test-build/pesaclarity-ios-unsigned.ipa" \
          python3 tool/sidestore_source.py > "$RUNNER_TEMP/ipa/pesaclarity-sidestore.json"
          echo "SOURCE=$RUNNER_TEMP/ipa/pesaclarity-sidestore.json" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: pesaclarity-ios-unsigned
          path: ${{ env.IPA }}
          retention-days: 14

      - name: Put on the test-build release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # The commit file tells the next evening run what is already built.
        run: |
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/ipa/pesaclarity-ios-commit.txt"
          gh release upload test-build "$IPA" "$SOURCE" \
            "$RUNNER_TEMP/ipa/pesaclarity-ios-commit.txt" --clobber

      - name: Build for the simulator
        if: inputs.simulator
        run: |
          flutter build ios --simulator --debug --dart-define=RAYO_ONLY=true --dart-define=SLM_EXPERIMENT=true
          mkdir -p build/ios/iphonesimulator/Runner.app/slm
          cp "$RUNNER_TEMP/slm/smollm2-360m-instruct-q4.weights" build/ios/iphonesimulator/Runner.app/slm/

      - uses: actions/upload-artifact@v7
        if: inputs.simulator
        with:
          name: pesaclarity-ios-simulator
          path: build/ios/iphonesimulator/Runner.app
          retention-days: 14
