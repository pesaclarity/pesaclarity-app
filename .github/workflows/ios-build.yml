name: iOS build

# Builds the iPhone app without signing. The unsigned .ipa is for testers who
# sideload with their own Apple ID (SideStore or AltStore re-sign it, and it
# lasts 7 days per signing). Run by hand. TestFlight needs an Apple developer
# account first.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Put the unsigned .ipa on the test-build release
        type: boolean
        default: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.8"

jobs:
  build:
    name: Build for iPhone (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Server settings come from the dev environment's variables; empty
      # ones leave that feature off.
      - name: Build the app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          API_URL: ${{ secrets.DEV_PESACLARITY_API_URL || vars.DEV_PESACLARITY_API_URL }}
          VAULT_URL: ${{ secrets.DEV_PESACLARITY_VAULT_URL || vars.DEV_PESACLARITY_VAULT_URL || secrets.DEV_PESACLARITY_API_URL || vars.DEV_PESACLARITY_API_URL }}
          PINNED_HOSTS: ${{ vars.DEV_PESACLARITY_PINNED_HOSTS }}
          TRUSTED_ROOTS: ${{ vars.DEV_PESACLARITY_TRUSTED_ROOTS }}
          RATES_URL: ${{ vars.PESACLARITY_RATES_URL }}
          RATES_SOURCE_NAME: ${{ vars.PESACLARITY_RATES_SOURCE_NAME }}
          RATES_SOURCE_URL: ${{ vars.PESACLARITY_RATES_SOURCE_URL }}
        run: |
          # Repository variables replace tool/rates.env's service.
          . tool/rates.env
          RATES_URL="${RATES_URL:-$PESACLARITY_RATES_URL}"
          RATES_SOURCE_NAME="${RATES_SOURCE_NAME:-$PESACLARITY_RATES_SOURCE_NAME}"
          RATES_SOURCE_URL="${RATES_SOURCE_URL:-$PESACLARITY_RATES_SOURCE_URL}"
          flutter build ios --release --no-codesign \
            --build-number="$BUILD_NUMBER" \
            --dart-define=PESACLARITY_API_URL="$API_URL" \
            --dart-define=PESACLARITY_VAULT_URL="$VAULT_URL" \
            --dart-define=PESACLARITY_PINNED_HOSTS="$PINNED_HOSTS" \
            --dart-define=PESACLARITY_TRUSTED_ROOTS="$TRUSTED_ROOTS" \
            --dart-define=PESACLARITY_RATES_URL="$RATES_URL" \
            --dart-define=PESACLARITY_RATES_SOURCE_NAME="$RATES_SOURCE_NAME" \
            --dart-define=PESACLARITY_RATES_SOURCE_URL="$RATES_SOURCE_URL"

      # An .ipa is the .app inside a Payload folder, zipped. Unsigned: the
      # sideloading tool signs it with the tester's Apple ID, which leaves out
      # App Attest, so sign-in stays off on these builds.
      - name: Package the unsigned .ipa
        run: |
          out="$RUNNER_TEMP/ipa"
          mkdir -p "$out/Payload"
          cp -R build/ios/iphoneos/Runner.app "$out/Payload/"
          (cd "$out" && zip -qr pesaclarity-ios-unsigned.ipa Payload)
          echo "IPA=$out/pesaclarity-ios-unsigned.ipa" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: pesaclarity-ios-unsigned
          path: ${{ env.IPA }}
          retention-days: 14

      - name: Put on the test-build release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload test-build "$IPA" --clobber

      - name: Build for the simulator
        run: flutter build ios --simulator --debug

      - uses: actions/upload-artifact@v7
        with:
          name: pesaclarity-ios-simulator
          path: build/ios/iphonesimulator/Runner.app
          retention-days: 14
