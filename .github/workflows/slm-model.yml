name: Phone language model (experiment)

# The language model the iPhone test build carries for the on-phone model
# experiment (SLM_EXPERIMENT, test builds only): SmolLM2 fine-tuned on
# synthetic data only to pick a chart and explain the app's facts
# (pesaclarity-ml, docs/SLM.md and .github/workflows/slm-fine-tune.yml, which
# trains it from Hugging Face's files checked against the pinned revision,
# converts it with rayo-convert at the rayo commit the app pins and checks
# rayo's replies against torch's). This takes the .weights from
# pesaclarity-ml's `slm-models` prerelease, checks it against the SHA-256
# pinned here, and puts it, its SHA256SUMS and the licence on this
# repository's `slm-models` prerelease. Later runs find it there and stop.
# Called by ios-build.yml and ios-model-test.yml; never by a release
# workflow.
on:
  workflow_call:
    outputs:
      sha256:
        description: SHA-256 of the .weights on the slm-models release
        value: ${{ jobs.model.outputs.sha256 }}
      asset:
        description: The .weights file's name on the slm-models release
        value: ${{ jobs.model.outputs.asset }}
  workflow_dispatch:

permissions:
  contents: write

env:
  ASSET: __ASSET__
  SHA256: __SHA256__
  TAG: slm-models
  ML_REPO: pesaclarity/pesaclarity-ml

jobs:
  model:
    name: Fine-tuned SmolLM2 for rayo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.done.outputs.sha256 }}
      asset: ${{ steps.done.outputs.asset }}
    steps:
      - id: have
        name: Already on the release?
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sum="$(gh release download "$TAG" -p SHA256SUMS -O - 2>/dev/null | awk -v a="$ASSET" '$2 == a {print $1}' || true)"
          if [ "$sum" = "$SHA256" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Take it from pesaclarity-ml and check it
        if: steps.have.outputs.have != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "$TAG" -R "$ML_REPO" -p "$ASSET" -p SHA256SUMS -p MODEL-LICENCE.txt -p SLM-EVAL.md --clobber
          echo "$SHA256  $ASSET" | sha256sum -c -
          grep -F "$SHA256  $ASSET" SHA256SUMS
          # This file's line and the sources it was trained from.
          (grep -F "  $ASSET" SHA256SUMS; grep '  source-' SHA256SUMS) > SUMS.new
          mv SUMS.new SHA256SUMS
          cat SHA256SUMS

      - name: Put it on the slm-models prerelease
        if: steps.have.outputs.have != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease \
            --title "On-phone language model (experiment, test builds only)" \
            --notes "Models for the SLM experiment in iPhone test builds. Not used by release builds."
          gh release upload "$TAG" "$ASSET" SHA256SUMS MODEL-LICENCE.txt SLM-EVAL.md --clobber

      - id: done
        name: The release's checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sum="$(gh release download "$TAG" -p SHA256SUMS -O - | awk -v a="$ASSET" '$2 == a {print $1}')"
          test "$sum" = "$SHA256"
          echo "sha256=$sum" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "$ASSET $sum"
