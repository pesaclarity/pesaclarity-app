name: Ask money models

# Ask's money models, which people download on their phone when they ask
# for them (Ask settings; tool/ask_models.json): Light (SmolLM2-135M),
# fine-tuned on synthetic data only to pick a chart and
# explain the app's facts (pesaclarity-ml, docs/SLM.md and
# .github/workflows/slm-fine-tune.yml and slm-lean.yml, which train them from
# Hugging Face's files checked against pinned revisions, convert them with
# rayo-convert at the rayo commit the app pins and check rayo's replies
# against torch's). This takes each .weights from pesaclarity-ml's
# `slm-models` prerelease, checks it against the SHA-256 pinned here (the
# same as the catalogue's), and puts it, SHA256SUMS, the licence and the
# evaluation reports on this repository's `slm-models` prerelease, where
# the catalogue's URLs point. Later runs find them there and stop. Called by
# ios-model-test.yml (which runs Light on rayo in a simulator); never by a
# release workflow.
on:
  workflow_call:
    outputs:
      sha256:
        description: SHA-256 of Light's .weights on the slm-models release
        value: ${{ jobs.model.outputs.sha256 }}
      asset:
        description: Light's .weights file name on the slm-models release
        value: ${{ jobs.model.outputs.asset }}
  workflow_dispatch:

permissions:
  contents: write

env:
  # Light: SmolLM2-135M-Instruct fine-tuned, vocabulary trimmed, int8
  # (pesaclarity-ml docs/SLM-EVAL.md). The 360M model missed the score bars,
  # so there is no Full model yet.
  LIGHT: pesaclarity-smollm2-135m-trim-int8.weights
  LIGHT_SHA256: 656ec8e42e5bbc0ce4f1686664f201b810a30bcdd4ba797ef4998c372b2031cc
  TAG: slm-models
  ML_REPO: pesaclarity/pesaclarity-ml

jobs:
  model:
    name: Light for rayo
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      sha256: ${{ steps.done.outputs.sha256 }}
      asset: ${{ steps.done.outputs.asset }}
    steps:
      - id: have
        name: Already on the release?
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sums="$(gh release download "$TAG" -p SHA256SUMS -O - 2>/dev/null || true)"
          if echo "$sums" | grep -qxF "$LIGHT_SHA256  $LIGHT"; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Take them from pesaclarity-ml and check them
        if: steps.have.outputs.have != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release download "$TAG" -R "$ML_REPO" -p "$LIGHT" -p SHA256SUMS \
            -p MODEL-LICENCE.txt -p 'SLM-*.md' --clobber
          mv SHA256SUMS ML-SHA256SUMS
          printf '%s  %s\n' "$LIGHT_SHA256" "$LIGHT" > SHA256SUMS
          sha256sum -c SHA256SUMS
          # The sources they were trained from, as pesaclarity-ml lists them.
          grep '  source-' ML-SHA256SUMS >> SHA256SUMS || true
          cat SHA256SUMS

      - name: Put them on the slm-models prerelease
        if: steps.have.outputs.have != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease \
            --title "Ask money models" \
            --notes "Ask's downloadable money models. See tool/ask_models.json."
          gh release upload "$TAG" "$LIGHT" SHA256SUMS MODEL-LICENCE.txt SLM-*.md --clobber

      - id: done
        name: The release's checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sums="$(gh release download "$TAG" -p SHA256SUMS -O -)"
          echo "$sums" | grep -qxF "$LIGHT_SHA256  $LIGHT"
          echo "sha256=$LIGHT_SHA256" >> "$GITHUB_OUTPUT"
          echo "asset=$LIGHT" >> "$GITHUB_OUTPUT"
