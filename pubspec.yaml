name: pesaclarity
description: Pesa Clarity turns M-Pesa and bank SMS into a clear daily plan, on the phone.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.35.3
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.8.0
  cryptography: ^2.9.0
  # Pinned to a commit on main for reproducible builds.
  # TODO(ujumbe): switch the ref to tag v0.1.0 once it is tagged.
  ujumbe:
    git:
      url: https://github.com/pesaclarity/ujumbe-parsers.git
      ref: 01440803df03352ede7523644f3d1edb21a75277
  # Statement PDFs are read on the phone with PDFium. pdfium_flutter is not
  # imported; its build hooks bundle the PDFium library into the app.
  pdfrx_engine: ^0.8.0
  pdfium_flutter: ^0.4.0
  file_selector: ^1.1.0
  crypto: ^3.0.7
  local_auth: ^3.0.2
  local_auth_android: ^2.3.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.2
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# package:sqlite3 bundles SQLCipher through its build hook. This replaces
# sqlcipher_flutter_libs, which reached end of life with sqlite3 3.x.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
