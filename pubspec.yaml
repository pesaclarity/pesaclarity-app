name: pesaclarity
description: Pesa Clarity turns M-Pesa and bank SMS into a clear daily plan, on the phone.
publish_to: none
version: 0.5.1+6

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.6.0
  drift: ^2.35.4
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  share_plus: ^13.3.1
  sqlite3: ^3.9.1
  cryptography: ^2.9.0
  # Pinned to a commit on main for reproducible builds.
  ujumbe:
    git:
      url: https://github.com/pesaclarity/ujumbe-parsers.git
      ref: v0.3.0
  # rayo (pesaclarity/rayo, AGPL-3.0) runs the Ask models and the message
  # reader; its build hook compiles its C from source for each target. Pinned
  # to a commit on main (the one pesaclarity-ml exports and scores the reader
  # with) until the v0.1.0 tag exists on GitHub; then use `ref: v0.1.0`.
  rayo:
    git:
      url: https://github.com/pesaclarity/rayo.git
      ref: 054c8311619f60b38fed07c8042cf9564e36126f
  printing: ^5.15.1
  http: ^1.6.0
  flutter_local_notifications: ^23.0.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  # Statement PDFs are read on the phone with PDFium. pdfium_flutter is not
  # imported; its build hooks bundle the PDFium library into the app.
  # tool/prepare_foss.sh deletes this comment and the next two lines for F-Droid.
  pdfrx_engine: ^0.9.1
  pdfium_flutter: ^0.4.1
  file_selector: ^1.1.0
  crypto: ^3.0.7
  local_auth: ^3.0.2
  local_auth_android: ^2.3.0
  ffi: ^2.2.0
  cupertino_icons: ^2.0.0

dev_dependencies:
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# package:sqlite3 bundles SQLCipher through its build hook. This replaces
# sqlcipher_flutter_libs, which reached end of life with sqlite3 3.x.
# tool/prepare_foss.sh replaces `source: sqlcipher` (a prebuilt download) so
# the foss build compiles SQLCipher from source; keep that line as it is.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

flutter:
  uses-material-design: true
  assets:
    - assets/policy/
    - assets/tax/
    # Ask's question reader, exported by pesaclarity-ml (akili ask-reader).
    - assets/models/ask/
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
