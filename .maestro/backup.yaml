appId: com.pesaclarity.app
name: Backup and restore
tags:
  - screens
---
- runFlow: subflows/onboarded.yaml
- tapOn:
    id: home-profile
- assertVisible:
    id: title-profile
- scrollUntilVisible:
    element:
      id: profile-backup
- tapOn:
    id: profile-backup
- assertVisible:
    id: title-backup
- waitForAnimationToEnd
- takeScreenshot: 10-backup-${THEME}
