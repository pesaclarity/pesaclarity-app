# Fresh launch, then straight through onboarding to Home with M-Pesa ticked.
appId: com.pesaclarity.app
---
- runFlow: launch-fresh.yaml
- tapOn:
    id: onboarding-get-started
- extendedWaitUntil:
    visible:
      id: title-my-accounts
    timeout: 10000
- tapOn:
    id: institution-mpesa
- assertVisible:
    id: institution-mpesa
    checked: true
- scrollUntilVisible:
    element:
      id: onboarding-scan-messages
- tapOn:
    id: onboarding-scan-messages
- extendedWaitUntil:
    visible:
      id: title-sms-scan
    timeout: 10000
- tapOn:
    id: sms-scan-not-now
- extendedWaitUntil:
    visible:
      id: title-home
    timeout: 10000
