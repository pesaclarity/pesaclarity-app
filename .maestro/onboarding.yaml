appId: com.pesaclarity.app
name: Onboarding
tags:
  - onboarding
---
- runFlow: subflows/launch-fresh.yaml
- assertVisible:
    id: title-welcome
- assertVisible: "Get started"
- waitForAnimationToEnd
- takeScreenshot: 01-onboarding-welcome-${THEME}
- tapOn:
    id: onboarding-get-started
- assertVisible:
    id: title-currency
- waitForAnimationToEnd
- takeScreenshot: 01b-onboarding-currency-${THEME}
# The emulator's region may not be Kenya; pick KES so amounts read as in
# the designs.
- tapOn: "Search by name or code"
- inputText: "KES"
- tapOn: "Kenyan Shilling"
- hideKeyboard
- tapOn:
    id: onboarding-currency-continue
- assertVisible:
    id: title-my-accounts
- assertVisible:
    id: institution-mpesa
    checked: false
- assertVisible: "Tick at least one account to continue."
- waitForAnimationToEnd
- takeScreenshot: 02-onboarding-my-accounts-${THEME}
- tapOn:
    id: institution-mpesa
- assertVisible:
    id: institution-mpesa
    checked: true
- scrollUntilVisible:
    element:
      id: onboarding-scan-messages
- assertVisible:
    id: onboarding-scan-messages
    enabled: true
- waitForAnimationToEnd
- takeScreenshot: 02b-onboarding-my-accounts-ticked-${THEME}
- tapOn:
    id: onboarding-scan-messages
- extendedWaitUntil:
    visible:
      id: title-sms-scan
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 02c-onboarding-sms-scan-${THEME}
- tapOn:
    id: sms-scan-not-now
- assertVisible:
    id: title-home
- assertVisible:
    id: nav-home
